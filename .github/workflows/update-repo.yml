name: update-repo

on:
  push:
    branches: [main]
    paths:
      - 'pool/**'
      - 'build-repo.sh'
      - '.github/workflows/update-repo.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build repo
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
          bash build-repo.sh

      - name: Commit generated files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nenhuma alteracao - nada a commitar"
          else
            git commit -m "rebuild: atualizar indice do repositorio apt"
            git pull --no-edit --rebase=false origin main
            git push
            echo "Alteracoes commitadas e enviadas"
          fi